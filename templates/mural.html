<title>Mural AI - WALLCRAFT AI</title>

<style>

    body{
        font-family: Arial, sans-serif;
        background:#111;
        color:white;
        text-align:center;
        padding:50px;
    }

    .box{
        background:#222;
        padding:40px;
        border-radius:15px;
        max-width:700px;
        margin:auto;
    }

    textarea{
        width:90%;
        height:120px;
        padding:15px;
        border-radius:10px;
        font-size:16px;
        resize:none;
    }

    button{
        margin-top:20px;
        padding:12px 35px;
        border:none;
        border-radius:25px;
        background:#ff6b6b;
        color:white;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        background:#ff4757;
    }

    img{
        margin-top:30px;
        width:512px;
        max-width:90%;
        border-radius:15px;
    }

    .error{
        color:red;
        margin-top:20px;
    }

</style>

{% include 'header.html' %}

<div class="box">

    <h1>🎨 Mural AI Generator</h1>

    <p>Create amazing AI mural wallpapers using AI</p>

    <form method="POST" action="{% url 'mural' %}">

        {% csrf_token %}

        <textarea
            name="prompt"
            placeholder="Describe your mural..."
            required
        ></textarea>

        <br>

        <button type="submit">
            Generate AI Mural
        </button>

    </form>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    {% if image %}

        <img
            src="{{ image }}"
            alt="Generated Mural"
        >

    {% endif %}

</div>
