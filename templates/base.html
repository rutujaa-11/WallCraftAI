<!DOCTYPE html>
<html>
<head>
    <title>WALLCRAFT AI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            padding: 15px 40px;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #00ffff;
        }

        .content {
            padding: 30px;
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        <a href="/" style="color:white;text-decoration:none;">
            WALLCRAFT AI
        </a>
    </div>

    <nav>
        <a href="/mural/">Mural</a>
        <a href="/painting/">Painting</a>
        <a href="/general/">General</a>
    </nav>

</header>


<div class="content">
    {% block content %}
    {% endblock %}
</div>


</body>
</html>
